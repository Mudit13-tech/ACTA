<!doctype html><html><head><meta charset="utf-8">
<style>
 html,body{margin:0;background:#000;}
 iframe{width:390px;height:844px;border:0;display:block;}
 pre{position:absolute;left:400px;top:0;color:#0f0;font:11px monospace;white-space:pre-wrap;width:560px}
</style></head><body>
<iframe id="f"></iframe>
<pre id="DEBUGOUT">loading…</pre>
<script>
var page = new URLSearchParams(location.search).get('p') || 'dashboard';
var f = document.getElementById('f');
var q = new URLSearchParams(location.search).get('q');
f.src = page + '.html' + (q ? '?' + q : '');
f.addEventListener('load', function () {
  setTimeout(function () {
    var d = f.contentDocument, w = f.contentWindow;
    var vw = d.documentElement.clientWidth;
    var out = ['page=' + page, 'viewport=' + vw,
               'docScrollW=' + d.documentElement.scrollWidth,
               'errors=' + (w.__errs || []).join(' | ')];
    d.querySelectorAll('*').forEach(function (el) {
      if (el.closest('.aurora')) return;
      var sc = el.closest('[style*="overflow"], .rail, .suggestions, .filter-bar, .stage-strip, .compare-scroll, .marquee, .timeline-wrap');
      if (sc && sc !== el) return;
      var r = el.getBoundingClientRect();
      if (r.right > vw + 1 || r.left < -1) {
        out.push('OVERFLOW ' + el.tagName + '.' + (el.className || '').toString().slice(0, 50) +
                 ' w=' + Math.round(r.width) + ' L=' + Math.round(r.left) + ' R=' + Math.round(r.right));
      }
    });
    document.getElementById('DEBUGOUT').textContent = out.join('\n');
  }, 2600);
});
</script></body></html>
