<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="description" content="Start tasks and see everything your agent is doing right now.">
<title>ACTA — Command Center</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/glass.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/app.css">
<script>
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('acta.state.v1') || '{}');
      var t = (s.prefs && s.prefs.theme) || 'dark';
      if (t === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body data-page="dashboard" data-frame="phone">

<div class="shell">
  <main class="page" id="page">
    <section id="greeting"></section>
    <section id="composer"></section>
    <section id="quickStats"></section>
    <section id="alerts"></section>
    <section id="activeTasks"></section>
    <section id="activityPreview"></section>
  </main>
</div>

<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/data.js"></script>
<script src="js/motion.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/agent.js"></script>
<script src="js/pages/dashboard.js"></script>

<script>
window.addEventListener('load', function(){
  setTimeout(function(){
    var vw = document.documentElement.clientWidth;
    var out = ['viewport=' + vw,
               'docScrollW=' + document.documentElement.scrollWidth,
               'bodyScrollW=' + document.body.scrollWidth];
    document.querySelectorAll('*').forEach(function(el){
      var r = el.getBoundingClientRect();
      if (r.width > vw + 1 || r.right > vw + 1) {
        out.push(el.tagName + '.' + (el.className||'').toString().slice(0,60) +
                 ' w=' + Math.round(r.width) + ' left=' + Math.round(r.left) + ' right=' + Math.round(r.right));
      }
    });
    var pre = document.createElement('pre');
    pre.id = 'DEBUGOUT';
    pre.textContent = out.join('\n');
    document.body.appendChild(pre);
  }, 1500);
});
</script>
</body>
</html>
