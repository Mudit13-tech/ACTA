<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACTCA Frontend</title>
    <!-- Premium fonts -->
    <link href="https://fonts.googleapis.com/css2?family=ABORETO&family=Fahkwang+Light&display=swap" rel="stylesheet" />
    <!-- Theme variables -->
    <style>
      :root {
        --font-primary: 'ABORETO', sans-serif;
        --font-secondary: 'Fahkwang Light', sans-serif;
        --color-bg-dark: #0a0a1a; /* midnight alloy base */
        --color-bg-light: #fff8e1; /* golden dawn base */
        --gradient-dark: linear-gradient(135deg, #1a1a2e, #0a0a1a);
        --gradient-light: linear-gradient(135deg, #ffe5b4, #fff8e1);
        --glass-bg: rgba(255, 255, 255, 0.08);
        --glass-border: rgba(255, 255, 255, 0.12);
      }
      body {
        margin: 0;
        font-family: var(--font-primary);
        background: var(--gradient-light);
        color: #222;
      }
      .dark body {
        background: var(--gradient-dark);
        color: #eee;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
