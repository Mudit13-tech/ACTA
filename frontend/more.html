<script>window.__errs=[];window.addEventListener("error",function(e){window.__errs.push(e.message+" @"+(e.filename||"").split("/").pop()+":"+e.lineno)});window.addEventListener("unhandledrejection",function(e){window.__errs.push("promise: "+e.reason)});</script>

<script>
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('acta.state.v1') || '{}');
      var t = (s.prefs && s.prefs.theme) || 'dark';
      if (t === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
